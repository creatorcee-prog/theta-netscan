<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0d1117" />
  <meta name="description" content="Theta NetScan — Network Intelligence & Field Diagnostics Platform" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="public/icon-192.png" />
  <title>Theta NetScan</title>
  <link rel="stylesheet" href="src/css/main.css" />
  <link rel="stylesheet" href="src/css/topology.css" />
  <link rel="stylesheet" href="src/css/components.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <button id="nav-toggle" class="icon-btn" aria-label="Toggle navigation">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div class="brand">
          <span class="brand-mark">Θ</span>
          <span class="brand-name">NetScan</span>
          <span class="version">v0.3</span>
        </div>
      </div>
      <div class="header-center">
        <div class="session-selector" id="session-selector">
          <select id="session-select" aria-label="Active session"></select>
          <button id="session-new" class="icon-btn" title="New session">+</button>
        </div>
      </div>
      <div class="header-right">
        <span id="backend-badge" class="badge badge-muted" title="Current execution backend">Browser</span>
        <button id="capability-btn" class="icon-btn" title="Discovery capabilities">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Navigation Drawer -->
    <nav id="nav-drawer" class="nav-drawer">
      <ul class="nav-list">
        <li data-view="overview" class="nav-item active"><span class="nav-icon">◉</span> Overview</li>
        <li data-view="map" class="nav-item"><span class="nav-icon">⬡</span> Network Map</li>
        <li data-view="devices" class="nav-item"><span class="nav-icon">▤</span> Devices</li>
        <li data-view="infrastructure" class="nav-item"><span class="nav-icon">▣</span> Infrastructure</li>
        <li data-view="traffic" class="nav-item"><span class="nav-icon">⇌</span> Traffic</li>
        <li data-view="diagnostics" class="nav-item"><span class="nav-icon">⌁</span> Diagnostics</li>
        <li data-view="alerts" class="nav-item"><span class="nav-icon">⚠</span> Alerts</li>
        <li data-view="history" class="nav-item"><span class="nav-icon">◷</span> Scan History</li>
        <li data-view="reports" class="nav-item"><span class="nav-icon">☰</span> Reports</li>
        <li data-view="settings" class="nav-item"><span class="nav-icon">⚙</span> Settings</li>
      </ul>
      <div class="nav-footer">
        <div class="capability-mini" id="capability-mini">Browser-only mode</div>
      </div>
    </nav>
    <div id="nav-overlay" class="nav-overlay"></div>

    <!-- Main Content -->
    <main id="main-content" class="main-content">
      <!-- Views injected by JS -->
    </main>

    <!-- Device Inspector (slide-over) -->
    <aside id="device-inspector" class="inspector closed">
      <div class="inspector-header">
        <h2 id="inspector-title">Device</h2>
        <button id="inspector-close" class="icon-btn">✕</button>
      </div>
      <div id="inspector-body" class="inspector-body"></div>
    </aside>

    <!-- Capability Panel (modal) -->
    <div id="capability-modal" class="modal closed">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Discovery Capabilities</h2>
          <button class="modal-close icon-btn">✕</button>
        </div>
        <div id="capability-body" class="modal-body"></div>
      </div>
    </div>

    <!-- Toast container -->
    <div id="toast-container"></div>
  </div>

  <script type="module" src="src/js/app.js"></script>
</body>
</html>
